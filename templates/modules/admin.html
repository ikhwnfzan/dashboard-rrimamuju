<section id="mod-manage_users" class="mod-section hidden space-y-5">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-xl font-extrabold">Manage User</h2>
      <p class="text-xs text-slate-400">Kelola akun login pada tab <code>CFG_Users</code> (NIP, Password, Role)</p>
    </div>
    <button onclick="openUserModal()" class="text-xs font-bold px-4 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white transition">
      + Tambah / Edit Akun User
    </button>
  </div>

  <div class="bg-white dark:bg-[#111827] rounded-3xl border border-slate-200/80 dark:border-slate-800 p-5 overflow-x-auto">
    <table class="w-full text-left text-xs sm:text-sm">
      <thead class="text-slate-400 font-semibold border-b border-slate-100 dark:border-slate-800">
        <tr>
          <th class="py-3 px-3">NIP</th>
          <th class="py-3 px-3">Nama Pegawai</th>
          <th class="py-3 px-3">Posisi</th>
          <th class="py-3 px-3">Assigned Roles</th>
          <th class="py-3 px-3 text-right">Aksi</th>
        </tr>
      </thead>
      <tbody id="tbodyUsers" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
    </table>
    <div id="pagUsers" class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800"></div>
  </div>
</section>

<section id="mod-manage_modules" class="mod-section hidden space-y-5">
  <div>
    <h2 class="text-xl font-extrabold">Manage Module</h2>
    <p class="text-xs text-slate-400">Atur hak akses setiap role terhadap masing-masing modul di tab <code>CFG_Role_Modules</code></p>
  </div>

  <div class="bg-white dark:bg-[#111827] rounded-3xl border border-slate-200/80 dark:border-slate-800 p-5 overflow-x-auto">
    <table class="w-full text-left text-xs">
      <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500 font-bold">
        <tr id="matrixHeaderRow"></tr>
      </thead>
      <tbody id="matrixBodyRows" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
    </table>
  </div>
</section>
