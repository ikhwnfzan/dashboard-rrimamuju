<section id="mod-manage_users" class="mod-section hidden space-y-5">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-xl font-extrabold">Manage User</h2>
      <p class="text-xs text-slate-400">Kelola akun login pada tab <code>CFG_Users</code> (NIP, Password, Role)</p>
    </div>
    <button onclick="openUserModal()" class="text-xs font-bold px-4 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white transition">
      + Tambah / Edit Akun User
    </button>
  </div>

  <div class="bg-white dark:bg-[#111827] rounded-3xl border border-slate-200/80 dark:border-slate-800 p-5 overflow-x-auto">
    <table class="w-full text-left text-xs sm:text-sm">
      <thead class="text-slate-400 font-semibold border-b border-slate-100 dark:border-slate-800">
        <tr>
          <th class="py-3 px-3">NIP</th>
          <th class="py-3 px-3">Nama Pegawai</th>
          <th class="py-3 px-3">Posisi</th>
          <th class="py-3 px-3">Assigned Roles</th>
          <th class="py-3 px-3 text-right">Aksi</th>
        </tr>
      </thead>
      <tbody id="tbodyUsers" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
    </table>
    <div id="pagUsers" class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800"></div>
  </div>
</section>

<section id="mod-manage_modules" class="mod-section hidden space-y-5">
  <div>
    <h2 class="text-xl font-extrabold">Manage Module</h2>
    <p class="text-xs text-slate-400">Atur hak akses setiap role terhadap masing-masing modul di tab <code>CFG_Role_Modules</code></p>
  </div>

  <div class="bg-white dark:bg-[#111827] rounded-3xl border border-slate-200/80 dark:border-slate-800 p-5 overflow-x-auto">
    <table class="w-full text-left text-xs">
      <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500 font-bold">
        <tr id="matrixHeaderRow"></tr>
      </thead>
      <tbody id="matrixBodyRows" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
    </table>
  </div>
</section>

{% if 'Admin' in user.roles %}
<section id="mod-app_settings" class="mod-section hidden space-y-5">
  <div>
    <h2 class="text-xl font-extrabold">App Setting</h2>
  </div>

  <form onsubmit="submitAppSettings(event)" class="bg-white dark:bg-[#111827] rounded-3xl border border-slate-200/80 dark:border-slate-800 p-5 space-y-5">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <label class="space-y-1.5">
        <span class="block text-xs font-bold">Zona waktu</span>
        <select id="appTimezone" class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold">
          <option value="Asia/Jakarta">WIB — Asia/Jakarta</option>
          <option value="Asia/Makassar">WITA — Asia/Makassar</option>
          <option value="Asia/Jayapura">WIT — Asia/Jayapura</option>
          <option value="UTC">UTC</option>
        </select>
      </label>
      <label class="space-y-1.5">
        <span class="block text-xs font-bold">Bahasa</span>
        <select id="appLanguage" class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold">
          <option value="id">Bahasa Indonesia</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="space-y-1.5">
        <span class="block text-xs font-bold">Tema dashboard</span>
        <select id="appDefaultTheme" class="w-full px-3 py-2 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold">
          <option value="light">Terang</option>
          <option value="dark">Gelap</option>
        </select>
      </label>
    </div>
    <div class="flex justify-end">
      <button id="btnSaveAppSettings" type="submit" class="px-4 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-extrabold transition">
        Simpan Pengaturan
      </button>
    </div>
  </form>
</section>
{% endif %}
