<section id="mod-overview" class="mod-section space-y-6">
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5">
    <div class="bg-white dark:bg-[#111827] rounded-3xl p-5 border border-slate-300/80 dark:border-slate-700 dashed-kpi flex flex-col justify-between min-h-[155px]">
      <div class="flex items-start justify-between">
        <div>
          <h3 class="text-sm font-extrabold">Info Board</h3>
          <p class="text-[11px] text-slate-400 mt-0.5">Pengumuman Internal</p>
        </div>
        <span class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center">
          <i aria-hidden="true" class="ti ti-speakerphone w-4 h-4 text-base leading-none"></i>
        </span>
      </div>
      <div class="flex items-end justify-between mt-4">
        <div>
          <p class="text-3xl font-extrabold" id="statInfoCount">0</p>
        </div>
        <button onclick="switchModule('info_board')" class="w-8 h-8 rounded-full bg-slate-900 dark:bg-slate-700 text-white flex items-center justify-center">
          <i aria-hidden="true" class="ti ti-arrow-right w-3.5 h-3.5 text-sm leading-none"></i>
        </button>
      </div>
    </div>

    <div class="bg-white dark:bg-[#111827] rounded-3xl p-5 border border-slate-300/80 dark:border-slate-700 dashed-kpi flex flex-col justify-between min-h-[155px]">
      <div class="flex items-start justify-between">
        <div>
          <h3 class="text-sm font-extrabold">Modul Aktif</h3>
          <p class="text-[11px] text-slate-400 mt-0.5">Sesuai hak akses role</p>
        </div>
        <span class="w-8 h-8 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-600 flex items-center justify-center">
          <i aria-hidden="true" class="ti ti-layout-grid w-4 h-4 text-base leading-none"></i>
        </span>
      </div>
      <div class="flex items-end justify-between mt-4">
        <div>
          <p class="text-3xl font-extrabold" id="statAccessibleMods">0</p>
        </div>
      </div>
    </div>

    <div class="bg-white dark:bg-[#111827] rounded-3xl p-5 border border-slate-300/80 dark:border-slate-700 dashed-kpi flex flex-col justify-between min-h-[155px]">
      <div class="flex items-start justify-between">
        <div>
          <h3 class="text-sm font-extrabold">Sinkronisasi Database</h3>
          <p class="text-[11px] text-slate-400 mt-0.5">Realtime</p>
        </div>
        <span id="syncBadge" class="px-2.5 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950 text-emerald-600 text-[10px] font-extrabold">Live</span>
      </div>
      <div class="mt-4">
        <p class="text-xs font-bold truncate" id="syncStatusLabel">Memuat...</p>
        <p class="text-[11px] text-slate-400 mt-0.5" id="syncTimeLabel">-</p>
      </div>
    </div>

    <div class="bg-gradient-to-br from-[#0D9488] via-[#0891B2] to-[#0E7490] text-white rounded-3xl p-5 shadow-lg flex flex-col justify-between min-h-[155px]">
      <div>
        <p class="text-xs font-bold text-cyan-100">Role Aktif</p>
        <h3 class="text-lg font-extrabold mt-0.5 leading-snug">{{ user.roles | join(' • ') }}</h3>
      </div>
      <div class="mt-3 flex gap-2">
        <button onclick="openUserProfile()" class="flex-1 py-2 rounded-full bg-white/20 hover:bg-white/30 text-white text-xs font-bold transition">Profil Saya</button>
        <a href="/" class="flex-1 inline-flex items-center justify-center gap-1 py-2 rounded-full bg-slate-950/90 hover:bg-slate-950 text-white text-xs font-bold transition">Portal ↗</a>
      </div>
    </div>
  </div>

  <div class="bg-white dark:bg-[#111827] rounded-3xl border border-slate-200/80 dark:border-slate-800 p-5 sm:p-6 space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div>
        <h2 class="text-base font-extrabold">Timeline Kegiatan</h2>
      </div>
      <button id="btnAddTimeline" onclick="openTimelineModal()" class="hidden text-xs font-bold px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white transition">
        + Tambah Kegiatan
      </button>
    </div>
    <div class="flex flex-wrap items-end gap-3">
      <label class="flex-1 min-w-[220px]">
        <span class="block text-[11px] font-bold text-slate-500 mb-1">Cari Kegiatan</span>
        <input id="searchTimeline" type="search" oninput="filterTimelineTable()" placeholder="Kegiatan, tahapan, keterangan..."
          class="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs" />
      </label>
      <label>
        <span class="block text-[11px] font-bold text-slate-500 mb-1">Mulai dari</span>
        <input id="timelineFilterStart" type="date" onchange="filterTimelineTable()"
          class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs" />
      </label>
      <label>
        <span class="block text-[11px] font-bold text-slate-500 mb-1">Sampai</span>
        <input id="timelineFilterEnd" type="date" onchange="filterTimelineTable()"
          class="px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs" />
      </label>
    </div>
    <div role="tablist" aria-label="Tampilan timeline" class="flex flex-wrap gap-2 border-b border-slate-200 dark:border-slate-700 pb-3">
      <button id="timelineTableTab" type="button" role="tab" aria-selected="true" onclick="setTimelineView('table')"
        class="timeline-view-tab px-3 py-1.5 rounded-lg border text-xs font-bold transition">Tabel</button>
      <button id="timelineCalendarTab" type="button" role="tab" aria-selected="false" onclick="setTimelineView('calendar')"
        class="timeline-view-tab px-3 py-1.5 rounded-lg border text-xs font-bold transition">Kalender</button>
      <button id="timelineHorizontalTab" type="button" role="tab" aria-selected="false" onclick="setTimelineView('horizontal')"
        class="timeline-view-tab px-3 py-1.5 rounded-lg border text-xs font-bold transition">Timeline</button>
    </div>
    <div id="timelineTableView" role="tabpanel" aria-labelledby="timelineTableTab">
      <div class="overflow-x-auto">
        <table class="w-full min-w-[760px] text-left text-xs">
          <thead class="text-[10px] uppercase tracking-wider text-slate-400 border-b border-slate-200 dark:border-slate-700">
            <tr>
              <th class="py-3 px-3"><button type="button" onclick="sortTimelineTable('Kegiatan')" class="hover:text-teal-600">Kegiatan <span id="sortTimelineKegiatan"></span></button></th>
              <th class="py-3 px-3"><button type="button" onclick="sortTimelineTable('Tahapan')" class="hover:text-teal-600">Tahapan <span id="sortTimelineTahapan"></span></button></th>
              <th class="py-3 px-3"><button type="button" onclick="sortTimelineTable('Tanggal Mulai')" class="hover:text-teal-600">Tanggal <span id="sortTimelineDate"></span></button></th>
              <th class="py-3 px-3"><button type="button" onclick="sortTimelineTable('Keterangan')" class="hover:text-teal-600">Keterangan <span id="sortTimelineKeterangan"></span></button></th>
              <th class="py-3 px-3 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="tbodyTimeline"></tbody>
        </table>
      </div>
      <div id="pagTimeline" class="pt-3"></div>
    </div>
    <div id="timelineCalendarView" role="tabpanel" aria-labelledby="timelineCalendarTab" class="hidden space-y-3">
      <div class="flex items-center justify-between gap-3">
        <button type="button" onclick="changeTimelineMonth(-1)" aria-label="Bulan sebelumnya"
          class="w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 font-bold">←</button>
        <h3 id="timelineCalendarMonth" class="font-extrabold text-sm capitalize"></h3>
        <button type="button" onclick="changeTimelineMonth(1)" aria-label="Bulan berikutnya"
          class="w-9 h-9 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 font-bold">→</button>
      </div>
      <div class="overflow-x-auto">
        <div class="min-w-[700px]">
          <div class="grid grid-cols-7 text-center text-[10px] font-extrabold text-slate-400 border-b border-slate-200 dark:border-slate-700">
            <div class="py-2">Min</div><div class="py-2">Sen</div><div class="py-2">Sel</div>
            <div class="py-2">Rab</div><div class="py-2">Kam</div><div class="py-2">Jum</div><div class="py-2">Sab</div>
          </div>
          <div id="timelineCalendarGrid" class="grid grid-cols-7 border-l border-slate-200 dark:border-slate-700"></div>
        </div>
      </div>
    </div>
    <div id="timelineHorizontalView" role="tabpanel" aria-labelledby="timelineHorizontalTab" class="hidden space-y-3">
      <div class="bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200/80 dark:border-slate-700 px-2 py-3">
        <div id="dashboardTimelineScroll" class="overflow-x-auto scroll-smooth pb-2">
          <div id="dashboardTimelineTrack" class="inline-flex items-center min-w-full px-6 py-3"></div>
        </div>
      </div>
      <p class="text-center text-[11px] text-slate-400">← Geser ke samping untuk melihat seluruh jadwal →</p>
    </div>
  </div>
</section>
