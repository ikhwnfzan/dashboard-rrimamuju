<section id="mod-data_pegawai" class="mod-section hidden space-y-5">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-xl font-extrabold">Data Pegawai</h2>
      <p class="text-xs text-slate-400">Kelola biodata, pangkat golongan, jabatan, status, dan posisi pegawai</p>
    </div>
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <div class="flex flex-nowrap sm:w-auto w-full text-right gap-2 items-center">
      <input type="text" id="searchPegawai" oninput="renderDataPegawai()" placeholder="Cari"
          class="text-xs px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 sm:w-64 w-full" />
        <button id="btnAddPegawai" onclick="openAddModal('DB_Pegawai')" class="hidden text-xs font-bold px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white transition w-auto sm:w-40">
            <i class="ti ti-plus" aria-hidden="true"></i><span class="hidden sm:inline"> Tambah Pegawai</span>
        </button>
      </div>
    </div>
  </div>
  <div class="bg-white dark:bg-[#111827] rounded-3xl border border-slate-200/80 dark:border-slate-800 p-5 w-full">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs">
        <thead class="text-slate-400 font-semibold border-b border-slate-100 dark:border-slate-800">
          <tr>
            <th class="py-3 px-3 whitespace-nowrap">No</th>
            <th class="py-3 px-3 whitespace-nowrap">NIP</th>
            <th class="py-3 px-3 whitespace-nowrap">Nama Pegawai</th>
            <th class="py-3 px-3 whitespace-nowrap">Pangkat Golongan</th>
            <th class="py-3 px-3 whitespace-nowrap">Jabatan</th>
            <th class="py-3 px-3 whitespace-nowrap">Posisi</th>
            <th class="py-3 px-3 whitespace-nowrap">Status</th>
            <th class="py-3 px-3 whitespace-nowrap">Aksi</th>
          </tr>
        </thead>
        <tbody id="tbodyPegawai" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
      </table>
    </div>
    <div id="pagPegawai" class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800"></div>
  </div>
</section>

<section id="mod-arsip_sdm" class="mod-section hidden space-y-5">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="text-xl font-extrabold">Arsip SDM</h2>
    </div>
    <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
      <div class="flex flex-nowrap sm:w-auto w-full text-right gap-2 items-center">
        <input type="text" id="searchArsipSdm" oninput="renderArsipSdm()" placeholder="Cari"
          class="text-xs px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 sm:w-64 w-full" />
        <button id="btnAddArsipSdm" onclick="openAddModal('DB_SDM_Arsip')" class="hidden text-xs font-bold px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white transition w-auto sm:w-40">
          <i class="ti ti-plus" aria-hidden="true"></i><span class="hidden sm:inline"> Upload Berkas</span>
        </button>
      </div>
    </div>
  </div>
  <div class="bg-white dark:bg-[#111827] rounded-3xl border border-slate-200/80 dark:border-slate-800 p-5 w-full">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-xs">
        <thead class="text-slate-400 font-semibold border-b border-slate-100 dark:border-slate-800">
          <tr>
            <th class="py-3 px-3 whitespace-nowrap">Nomor Dokumen</th>
            <th class="py-3 px-3 whitespace-nowrap">Nama Dokumen</th>
            <th class="py-3 px-3 whitespace-nowrap">Tanggal</th>
            <th class="py-3 px-3 whitespace-nowrap">Jenis</th>
            <th class="py-3 px-3 whitespace-nowrap">Aksi</th>
          </tr>
        </thead>
        <tbody id="tbodyArsipSdm" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
      </table>
    </div>
    <div id="pagArsipSdm" class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800"></div>
  </div>
</section>
