<!-- SDM: DATA PEGAWAI (WITH EDIT ACTION) -->
<section id="mod-data_pegawai" class="mod-section hidden space-y-5">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <span class="w-9 h-9 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 flex items-center justify-center">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </span>
      <div>
        <h2 class="text-xl font-extrabold">Data Pegawai</h2>
        <p class="text-xs text-slate-400">Kelola biodata, pangkat, jabatan, status, dan posisi pegawai</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <input type="text" id="searchPegawai" oninput="renderDataPegawai()" placeholder="Cari nama, NIP, jabatan..."
        class="text-xs px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 w-60" />
      <button id="btnAddPegawai" onclick="openAddModal('DB_Pegawai')" class="hidden text-xs font-bold px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white transition">
        + Tambah Pegawai
      </button>
    </div>
  </div>
  <div class="bg-white dark:bg-[#111827] rounded-3xl border border-slate-200/80 dark:border-slate-800 p-5 overflow-x-auto">
    <table class="w-full text-left text-xs sm:text-sm">
      <thead class="text-slate-400 font-semibold border-b border-slate-100 dark:border-slate-800">
        <tr>
          <th class="py-3 px-3">No</th>
          <th class="py-3 px-3">Nama Pegawai</th>
          <th class="py-3 px-3">NIP / NIPPK</th>
          <th class="py-3 px-3">Pangkat / Golongan</th>
          <th class="py-3 px-3">Jabatan</th>
          <th class="py-3 px-3">Posisi</th>
          <th class="py-3 px-3">Status</th>
          <th class="py-3 px-3 text-right">Aksi</th>
        </tr>
      </thead>
      <tbody id="tbodyPegawai" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
    </table>
    <div id="pagPegawai" class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800"></div>
  </div>
</section>

<!-- SDM: ARSIP SDM -->
<section id="mod-arsip_sdm" class="mod-section hidden space-y-5">
  <div class="flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <span class="w-9 h-9 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-300 flex items-center justify-center">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
      </span>
      <div>
        <h2 class="text-xl font-extrabold">Arsip SDM</h2>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <input type="text" id="searchArsipSdm" oninput="renderArsipSdm()" placeholder="Cari nomor/nama dokumen..."
        class="text-xs px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 w-60" />
      <button id="btnAddArsipSdm" onclick="openAddModal('Arsip_SDM')" class="hidden text-xs font-bold px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white transition">
        + Tambah Arsip SDM
      </button>
    </div>
  </div>
  <div class="bg-white dark:bg-[#111827] rounded-3xl border border-slate-200/80 dark:border-slate-800 p-5 overflow-x-auto">
    <table class="w-full text-left text-xs sm:text-sm">
      <thead class="text-slate-400 font-semibold border-b border-slate-100 dark:border-slate-800">
        <tr>
          <th class="py-3 px-3">Nomor Dokumen</th>
          <th class="py-3 px-3">Nama Dokumen</th>
          <th class="py-3 px-3">Tanggal</th>
          <th class="py-3 px-3">Jenis</th>
          <th class="py-3 px-3">Link</th>
        </tr>
      </thead>
      <tbody id="tbodyArsipSdm" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
    </table>
    <div id="pagArsipSdm" class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-800"></div>
  </div>
</section>
